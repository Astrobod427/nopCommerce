services:
  nopcommerce:
    image: ghcr.io/astrobod427/nopcommerce:latest
    container_name: nopcommerce
    restart: unless-stopped
    entrypoint: ["/opt/entrypoint.sh"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nopcommerce_appdata:/app/App_Data
      - nopcommerce_plugins:/app/Plugins
      - nopcommerce_wwwroot:/app/wwwroot
      - /opt/docker/nopcommerce/entrypoint.sh:/opt/entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traefik-net
      - nopcommerce-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=portainer-stack_traefik-net"
      - "traefik.http.routers.nopcommerce.rule=Host(`nopcommerce.petitnuage.cloud`)"
      - "traefik.http.routers.nopcommerce.entrypoints=websecure"
      - "traefik.http.routers.nopcommerce.tls.certresolver=letsencrypt"
      - "traefik.http.services.nopcommerce.loadbalancer.server.port=80"

  postgres:
    image: postgres:16-alpine
    container_name: nopcommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nopcommerce
      POSTGRES_USER: nopcommerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /opt/docker/nopcommerce/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nopcommerce-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nopcommerce -d nopcommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  traefik-net:
    external: true
    name: portainer-stack_traefik-net
  nopcommerce-internal:
    driver: bridge

volumes:
  nopcommerce_appdata:
  nopcommerce_plugins:
  nopcommerce_wwwroot:
  postgres_data:
